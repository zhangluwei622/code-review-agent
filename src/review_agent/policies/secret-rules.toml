version = 1
token_pattern = '(?:sk-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9]{12,}|github_pat_[A-Za-z0-9_]{12,}|AKIA[A-Z0-9]{16})'
assignment_pattern = '(?i)((?:api[_-]?key|access[_-]?token|password|secret|token)["\x27]?\s*[:=]\s*["\x27])([^"\x27\r\n]+)(["\x27])'
private_key_begin = '-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-----'
private_key_end = '-----END (?:[A-Z0-9]+ )*PRIVATE KEY-----'
