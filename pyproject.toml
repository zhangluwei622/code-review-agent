[project]
name = "code-review-agent"
version = "0.1.0"
description = "A local, ledger-backed LangGraph review demo"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
  "unidiff>=0.7.5,<0.8",
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
]

[project.scripts]
review-agent = "review_agent.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_agent"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
